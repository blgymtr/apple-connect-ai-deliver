name: "App Store AI PR Preview"

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write # Required for posting/updating preview comments

jobs:
  pr-metadata-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preview Release Notes on PR
        uses: blgymtr/apple-connect-ai-deliver@v1
        with:
          # AI Provider (Gemini, Claude, or OpenAI)
          provider: 'gemini'
          api_key: ${{ secrets.GEMINI_API_KEY }}

          # Dry Run & PR Comment Bot
          dry_run: 'true'
          pr_comment: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          locales: 'en-US,tr'
          style: 'bullet-points' # 'bullet-points' | 'emojis' | 'minimal' | 'detailed'
